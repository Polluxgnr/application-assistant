# Application Assistant: self-hosted n8n + Postgres + Cloudflare quick tunnel.
# Start:  docker compose up -d      Stop: docker compose down      (named volumes keep all data)

name: application-assistant

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ASSISTANT_DB: ${ASSISTANT_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # runs once, on the first start: creates the project database and its tables
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${ASSISTANT_DB} -c 'select 1 from sessions limit 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  n8n:
    image: n8nio/n8n:2.44.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Code nodes: Ed25519 check needs node's crypto module; ids and keys come from env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # keep the code runner warm: Discord allows only 3 s for the first answer
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "0"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DISCORD_APP_ID: ${DISCORD_APP_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_ADMIN_CHANNEL_ID: ${DISCORD_ADMIN_CHANNEL_ID}
      GOOGLE_CV_TEMPLATE_ID: ${GOOGLE_CV_TEMPLATE_ID}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./credentials:/credentials:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Public HTTPS URL for Discord's Interactions Endpoint (no account needed).
  # Get it with: scripts/tunnel-url.sh
  tunnel:
    image: cloudflare/cloudflared:2026.10.2
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://n8n:5678

volumes:
  pg_data:
  n8n_data:
